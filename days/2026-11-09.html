<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="일일 시황 — 2026-11-09">
<meta name="robots" content="noindex">
<title>일일 시황</title>
<style>
:root{--bg:#f5f5fa;--panel:#fff;--line:#e8e8f0;--fg:#1c1b2e;--mut:#7a7e91;
 --ink:#2e1f5e;--lav:#efedfa;--up:#e0374a;--down:#1f6fdc;--warn:#f5a623}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
 font:15.5px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,"Malgun Gothic",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased}
a{color:inherit} h1,h2,h3{margin:0;letter-spacing:-.02em}
.up{color:var(--up)} .down{color:var(--down)} .mut{color:var(--mut)}
.ink{color:var(--ink)!important}

.layout{display:flex;align-items:flex-start;min-height:100vh}
.side{position:sticky;top:0;flex:0 0 246px;width:246px;align-self:flex-start;background:var(--panel);
 border-right:1px solid var(--line);padding:16px 14px 20px;max-height:100vh;overflow-y:auto}
.logo{font-size:15px;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.logo em{font-style:normal;color:#8478d3}
.logo-s{font-size:11.5px;color:var(--mut);letter-spacing:.04em;margin-bottom:12px}

/* ── 달력 ── */
/* 월 접기 (2026-09-10): 연·월 제목 클릭으로 펼침/접힘. 이번 달만 기본 open */
details.calm summary{cursor:pointer;list-style:none;display:flex;align-items:center;
 justify-content:space-between;user-select:none}
details.calm summary::-webkit-details-marker{display:none}
.calm-tg::after{content:"▸";font-size:12px;color:#9a9eb0}
details[open].calm .calm-tg::after{content:"▾"}
details.calm{margin-bottom:2px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
 padding-top:10px;border-top:1px solid var(--line)}
.calh b{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.calh .yr{font-size:12.5px;color:var(--mut);font-weight:600}
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:11.5px;font-weight:600;color:#9a9eb0;padding:3px 0 5px}
.cal th.wk{color:#c2a0b0}
.cal td{text-align:center;padding:1px}
.cal td .d{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin:0 auto;
 font-size:13.5px;border-radius:50%;font-variant-numeric:tabular-nums;color:#4a4d5e}
.cal td.none .d{color:#c8cad4}
.cal td a.dl{text-decoration:none;display:block}
.cal td a.dl .d{cursor:pointer}
.cal td a.dl:hover .d{background:#4c3d95;color:#fff}
.calm{margin-bottom:10px}
.calm-h{font-size:13px;font-weight:700;color:#4c3d95;margin:8px 0 4px}
.cal td.wk .d{color:#b9a5ae}
.cal td.wk.none .d{color:#dcd2d6}
.cal td.has .d{background:#efedfa;color:var(--ink);font-weight:700;cursor:pointer}
.cal td.today .d{box-shadow:0 0 0 2px var(--ink) inset;background:var(--ink);color:#fff;font-weight:800}
.callg{display:flex;gap:10px;margin:9px 0 0;font-size:11.5px;color:#9a9eb0;flex-wrap:wrap}
.callg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;
 vertical-align:-1px}
.calnote{font-size:11.5px;color:#a8abb8;line-height:1.5;margin:8px 0 0}

.side hr{border:0;border-top:1px solid var(--line);margin:14px 0 10px}
.slbl{font-size:11.5px;letter-spacing:.1em;color:#9a9eb0;font-weight:700;margin-bottom:6px}
/* ── 테마 목록(사이드바) + 세부 패널 전환: 숨긴 라디오 + label ── */
.pgin{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;clip:rect(0 0 0 0)}
.tnavs{display:flex;flex-direction:column;gap:2px}
.tnav{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid transparent;
 border-radius:7px;cursor:pointer;transition:.14s;user-select:none}
.tnav:hover{background:#f7f6fc}
.tn-c{width:8px;height:8px;border-radius:2px;flex:none}
.tn-b{display:flex;flex-direction:column;min-width:0;flex:1}
.tn-b b{font-size:13.5px;font-weight:650;color:#4a4d5e;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
.titem{border-bottom:1px solid #f2f2f7}
.titem:last-child{border-bottom:0}
.tpan{display:none;padding:1px 0 8px 15px}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.slist li{font-size:12.5px;padding:2px 4px;border-radius:4px}
.rtcards{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px}
.rtcard{flex:0 0 200px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.rtcard-h{display:flex;align-items:center;gap:7px;padding:8px 11px;background:var(--lav)}
.rtcard-h b{font-size:13.5px}
.rtcard .slist{padding:7px 11px 10px;gap:7px}
.rtcard .slist li{font-size:13px;padding:0;background:none!important}
.rtcard .slist li .sn{white-space:normal}
.slist li.top{background:#fffdf6}
.sn{color:#4a4d5e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist li.top .sn{color:var(--ink);font-weight:700}
.sn b{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;padding:0 3px;
 border-radius:3px;background:var(--ink);color:#fff;vertical-align:1px}
